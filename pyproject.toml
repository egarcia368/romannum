[project]
name = "romannum"
version = "0.1.0"
description = "Convert between integers and roman numerals, one value per line, without loading the whole input into memory."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
romannum = "romannum.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
